<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全日制 · 斯芬克游戏动画科系</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 全日制页面专用样式 - 暗色主题适配 */
        .ft-page {
            padding-top: 68px;
            min-height: 100vh;
            background: var(--black);
        }

        /* 顶部导航栏 */
        .ft-header {
            position: sticky;
            top: 68px;
            z-index: 50;
            background: rgba(10,10,10,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gray-800);
        }
        .ft-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 24px;
        }
        .ft-header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--white);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ft-header-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .ft-header-nav a {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-400);
            text-decoration: none;
            border-radius: var(--radius-full);
            transition: all .25s var(--ease);
            white-space: nowrap;
        }
        .ft-header-nav a:hover {
            color: var(--white);
            background: var(--gray-800);
        }
        .ft-header-nav a.active {
            color: var(--white);
            background: var(--orange);
        }

        /* 内容区域 - 嵌入全日制页面 */
        .ft-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
        }
        .ft-iframe-wrap {
            width: 100%;
            min-height: calc(100vh - 132px);
            border: none;
            background: var(--black);
        }

        /* 如果直接嵌入内容 */
        .ft-embedded {
            background: var(--black);
        }
        .ft-embedded iframe {
            width: 100%;
            min-height: calc(100vh - 132px);
            border: none;
        }

        @media (max-width: 768px) {
            .ft-header-inner {
                padding: 0 16px;
                height: auto;
                min-height: 56px;
                flex-wrap: wrap;
                gap: 8px;
                padding-top: 12px;
                padding-bottom: 12px;
            }
            .ft-header-title {
                font-size: 16px;
            }
            .ft-header-nav a {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-main">斯芬克 · 游戏动画科系</span>
                    <span class="logo-sub">内部资料库</span>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">主页</a></li>
                <li><a href="index.html#cases" class="nav-link">作品案例</a></li>
                <li><a href="school-search.html" class="nav-link">院校查找</a></li>
                <li><a href="index.html#professors" class="nav-link">海外教授</a></li>
                <li><a href="index.html#programs" class="nav-link">短期项目</a></li>
                <li><a href="index.html#data" class="nav-link">录取数据</a></li>
                <li><a href="index.html#quick-entry" class="nav-link">快捷入口</a></li>
                <li class="nav-spacer"></li>
                <li><a href="fulltime.html" class="nav-link active">全日制</a></li>
                <li><a href="undergraduate.html" class="nav-link">本科</a></li>
                <li><a href="#" class="nav-link" style="opacity:.4;cursor:not-allowed">研究生</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <div class="ft-page">
        <!-- 全日制页面头部 -->
        <div class="ft-header">
            <div class="ft-header-inner">
                <div class="ft-header-title">1+2国际本科</div>
                <nav class="ft-header-nav">
                    <a href="fulltime/index.html#path">项目介绍</a>
                    <a href="fulltime/index.html#advantages">路径优势</a>
                    <a href="fulltime/index.html#majors">专业方向</a>
                    <a href="fulltime/index.html#timeline">学习路径</a>
                    <a href="fulltime/index.html#fit">适合学生</a>
                    <a href="fulltime/index.html#faq">FAQ</a>
                </nav>
            </div>
        </div>

        <!-- 嵌入全日制页面内容 -->
        <div class="ft-embedded">
            <iframe src="fulltime/index.html" title="全日制1+2国际本科"></iframe>
        </div>
    </div>

    <script>
        // 移动端菜单
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (navToggle && navLinks) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });
        }
    </script>
</body>
</html>
