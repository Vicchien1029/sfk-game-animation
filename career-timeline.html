<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFK 游戏动画｜多学制职业规划时间线</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --bg2:#121212;
  --panel:#1a1a1a;
  --ink:#f0f0f0;
  --muted:#999;
  --line:#2e2e2e;
  --deep:#ff4f00;
  --brand:#ff4f00;
  --soft-red:rgba(255,79,0,.18);
  --soft-yellow:rgba(255,200,80,.18);
  --soft-green:rgba(80,200,120,.18);
  --soft-purple:rgba(160,120,255,.18);
  --soft-blue:rgba(100,160,255,.18);
  --soft-orange:rgba(255,160,60,.18);
  --shadow:0 16px 40px rgba(0,0,0,.40);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{min-width:1180px;padding-top:68px}

.page{padding:20px 28px 42px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}
.eyebrow{font-size:13px;color:var(--brand);font-weight:900;letter-spacing:.08em;margin-bottom:8px}
.title{font-size:32px;line-height:1.16;font-weight:900}
.desc{margin-top:9px;color:var(--muted);font-size:14px;line-height:1.7;max-width:900px}
.badge{display:inline-flex;padding:10px 14px;border-radius:999px;background:rgba(255,79,0,.12);border:1px solid rgba(255,79,0,.30);color:var(--brand);font-size:13px;font-weight:800;white-space:nowrap}
.layout{display:grid;grid-template-columns:290px minmax(820px,1fr);gap:20px;align-items:start}
.side{position:sticky;top:88px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.side h2{margin:0 0 14px;font-size:17px;color:var(--ink);font-weight:600}
.label{font-size:12px;color:var(--muted);font-weight:900;margin:14px 0 8px}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:10px 8px;font-size:13px;cursor:pointer;text-align:center;color:var(--ink)}
.seg.active{background:var(--brand);color:#fff;border-color:var(--brand)}
select{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:11px 12px;font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);font-size:12px;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.summary{margin-top:15px;padding:13px;border:1px dashed rgba(255,79,0,.30);border-radius:16px;background:rgba(255,79,0,.08);font-size:13px;color:#ccc;line-height:1.7}
.kpi{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.k strong{display:block;font-size:14px}.k span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.printBtn{width:100%;margin-top:12px;border:0;border-radius:14px;padding:11px 14px;background:var(--brand);color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.printBtn:hover{opacity:.9}
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.programBanner{padding:15px 18px;background:rgba(255,79,0,.08);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}
.programBanner strong{font-size:16px}.programBanner span{font-size:12px;color:var(--muted)}
.year{border-top:1px solid var(--line)}
.year:first-of-type{border-top:0}
.yearHead{background:linear-gradient(135deg,#1a1a1a 0%,#252525 100%);color:var(--ink);padding:15px 18px;border-bottom:1px solid var(--line)}
.yearHead h2{margin:0;font-size:18px;font-weight:700}.yearHead p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.months,.terms,.lane{display:grid;grid-template-columns:110px repeat(12,1fr)}
.months{background:#141414;border-bottom:1px solid var(--line)}
.mLabel,.termLabel,.laneLabel{border-right:1px solid var(--line)}
.mLabel,.termLabel{padding:9px 10px;font-size:12px;font-weight:800;display:flex;align-items:center;color:var(--brand)}
.m{padding:9px 2px;text-align:center;font-size:13px;font-weight:800;border-right:1px solid var(--line);color:var(--ink)}
.terms{border-bottom:1px solid var(--line);background:#141414}
.term{padding:8px 5px;min-height:36px;font-size:11px;text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);color:#aaa}
.ta{background:rgba(100,160,255,.15)}.th{background:rgba(255,200,80,.15)}.ts{background:rgba(80,200,120,.15)}.te{background:rgba(200,100,160,.15)}.tu{background:rgba(255,160,60,.15)}.tp{background:rgba(160,120,255,.12)}.tg{background:rgba(100,200,180,.12)}
.lane{min-height:142px;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.laneLabel{background:var(--bg2);padding:14px 10px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.laneLabel strong{font-size:15px;color:var(--ink);font-weight:600}.laneLabel span{font-size:12px;color:var(--muted);line-height:1.5}
.cells{grid-column:2 / span 12;position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/12) 100%}
.bar{position:absolute;height:40px;border-radius:14px;padding:6px 12px;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 16px rgba(0,0,0,.30);display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;transition:.18s}
.bar:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(0,0,0,.35)}
.bar strong{font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar small{font-size:11px;line-height:1.15;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1{top:18px}.r2{top:65px}.r3{top:112px}
.key{background:var(--soft-red);color:#ffb8a0}.important{background:var(--brand);color:#fff}
.base{background:var(--soft-blue);color:#a0c8ff}.portfolio{background:var(--soft-purple);color:#c8b0ff}
.support{background:var(--soft-green);color:#90e0a0}.flag{background:var(--soft-orange);color:#ffd0a0}
.practice{background:var(--soft-yellow);color:#e8d080}.intern{background:rgba(255,200,80,.22);color:#e0c060}
.recruit{background:rgba(255,180,60,.25);color:#f0b860}
.hidden{display:none!important}.muted{opacity:.18}
.drawer{position:fixed;right:28px;bottom:28px;width:400px;max-width:calc(100vw - 56px);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.50);padding:18px;display:none;z-index:100}
.drawer.show{display:block}.drawer h3{margin:0 0 8px;font-size:18px;color:var(--ink);font-weight:600}.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.drawer p{font-size:14px;line-height:1.75;color:var(--muted);margin:0 0 10px}.drawer ul{padding-left:18px;font-size:13px;line-height:1.8;color:var(--muted)}
.close{position:absolute;right:10px;top:10px;width:28px;height:28px;border:0;border-radius:50%;background:var(--line);cursor:pointer;color:var(--ink);font-size:16px}

@media(max-width:1320px){.layout{grid-template-columns:1fr}.side{position:relative;top:0}}@media print{body{background:#fff}.page{padding:0}.side,.drawer{display:none!important}.layout{display:block}.timeline{box-shadow:none;border:0;border-radius:0}.programBanner{break-inside:avoid}.year{break-inside:avoid}}
</style>
</head>

<div class="page">
  <div class="top">
    <div>
      <div class="eyebrow">CAREER TIMELINE</div>
      <div class="title">多学制职业规划时间线</div>
      <div class="desc">根据本科与硕士阶段选择，自动生成对应学年的关键节点、专业成长与求职准备时间线。</div>
    </div>
    <div class="badge">SFK游戏动画科系</div>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>学生路径设置</h2>

      <div class="label">本科阶段</div>
      <div class="segment" id="ugBtns">
        <button class="seg active" data-value="3">三年制本科</button>
        <button class="seg" data-value="4">四年制本科</button>
      </div>

      <div class="label">硕士阶段</div>
      <div class="segment" id="masterBtns">
        <button class="seg active" data-value="1">一年制硕士</button>
        <button class="seg" data-value="2">两年制硕士</button>
      </div>

      <div class="label">显示维度</div>
      <div class="chips" id="filters">
        <span class="chip active" data-filter="keypoint">关键节点</span>
        <span class="chip active" data-filter="growth">专业成长</span>
        <span class="chip active" data-filter="jobprep">求职准备</span>
      </div>

      <div class="summary" id="summary"></div>
      <div class="kpi">
        <div class="k"><strong id="applyKpi">—</strong><span>研究生申请主窗口</span></div>
        <div class="k"><strong id="recruitKpi">—</strong><span>国内秋招主窗口</span></div>
      </div>
      <button class="printBtn" onclick="window.print()">导出 / 打印当前视图</button>
    </aside>

    <main class="timeline" id="timeline"></main>
  </div>
</div>

<div class="drawer" id="drawer">
  <button class="close" onclick="closeDrawer()">×</button>

</div>

<script>
let ugYears=3;
let masterYears=1;
let ugEnabled=true;
let masterEnabled=true;

const monthsUG=['09','10','11','12','01','02','03','04','05','06','07','08'];
const monthsM=['06','07','08','09','10','11','12','01','02','03','04','05'];
const termsUG='<div class="termLabel">学期 / 假期</div><div class="term ta" style="grid-column:2/span 3">秋季学期</div><div class="term th" style="grid-column:5/span 1">圣诞寒假</div><div class="term ts" style="grid-column:6/span 2">春季学期</div><div class="term te" style="grid-column:8/span 1">复活节前后</div><div class="term tu" style="grid-column:9/span 3">夏季学期 / 期末</div><div class="term th" style="grid-column:12/span 2">暑假</div>';
const termsM='<div class="termLabel">学期 / 假期</div><div class="term tp" style="grid-column:2/span 3">入学前准备</div><div class="term ta" style="grid-column:5/span 3">秋季学期 / 秋招</div><div class="term th" style="grid-column:8/span 1">圣诞假 / 秋招尾段</div><div class="term ts" style="grid-column:9/span 3">春季学期 / 春招</div><div class="term tg" style="grid-column:12/span 2">毕业项目 / 暑期</div>';

function item(title,meta,cls,left,width,body,todo){return {title,meta,cls,left,width,body,todo};}
function lane(type,title,desc,items){return {type,title,desc,items};}

function undergraduateYear(y,total){
  const isFinal=y===total;
  const isPenultimate=y===total-1;
  if(y===1){
    return {
      title:`大一｜专业认知与基础能力`,
      desc:'重点：方向探索、专业基础、项目归档习惯',
      lanes:[
        lane('keypoint','关键节点','建立未来申请与职业规划意识。',[
          item('专业方向初筛','10–11月','key r1',6,18,'初步判断适合的专业方向。','研究目标方向|了解院校与岗位|建立项目归档习惯'),
          item('作品归档意识','03–04月','key r2',56,18,'课程作业开始作为未来作品素材。','保留过程图|记录研究逻辑'),
          item('暑期规划','06–07月','key r1',82,12,'确认夏校、短期项目或能力补强。','确认暑期计划|制定补强重点')
        ]),
        lane('growth','专业成长','专业基础、作品集意识、安心办与夏校。',[
          item('专业基础','09–02月','base r1',0,44,'完成基础软件与项目方法训练。','专业基础训练|软件技能建立'),
          item('安心办 1–2','11–02月','support r2',18,24,'关注适应、GPA 与方向建立。','GPA 跟进|方向沟通'),
          item('作品集启蒙','03–05月','portfolio r1',48,26,'理解作品集的项目叙事逻辑。','整理课堂项目|形成初步目录'),
          item('夏校 1','07–08月','flag r2',82,12,'通过集中项目强化技能。','完成集中项目|获得外部反馈')
        ]),
        lane('jobprep','求职准备','先理解行业标准和岗位要求。',[
          item('行业认知积累','04–05月','practice r1',58,18,'了解岗位招聘要求和作品标准。','收集岗位 JD|关注行业案例'),
          item('轻量实践','07–08月','practice r2',84,10,'参加比赛或小型项目。','积累协作经验')
        ])
      ]
    };
  }

  if(isFinal){
    return {
      title:`大${cnNum(y)}｜申研递交与毕业衔接`,
      desc:'重点：完成研究生申请、毕业项目与求职作品集转译',
      lanes:[
        lane('keypoint','关键节点','最后学年承担申研递交与毕业衔接。',[
          item('递交研究生申请','09–12月','key important r1',0,27,'研究生申请主窗口。','作品集终稿|文书推荐信|递交申请|准备面试'),
          item('毕业设计启动','01–03月','key r2',42,18,'毕业项目尽量服务未来读研或就业。','明确毕业方向|确认项目深度'),
          item('硕前求职预热','07–08月','key r1',80,14,'硕士开学前开始关注秋招。','确认目标公司|关注秋招时间')
        ]),
        lane('growth','专业成长','完成申研作品集终稿与求职作品集基础版。',[
          item('申研作品集终稿','递交前完成','portfolio r1',0,27,'完成院校申请版本。','项目整合|排版完成|适配不同院校'),
          item('毕无忧','01–04月','support r2',35,20,'保障毕业、成绩与升学衔接。','毕业进度跟踪|Offer 条件跟踪'),
          item('求职作品集基础版','04–08月','portfolio r1',58,28,'将申研项目转译为岗位作品。','按岗位拆分版本|建立作品集网站')
        ]),
        lane('jobprep','求职准备','补足更贴近岗位的实习与项目经历。',[
          item('商业实践课','01–04月','practice r1',35,18,'用真实命题对齐岗位能力。','形成面试讲述案例'),
          item('岗位实习','02–05月','intern r2',43,18,'完成更贴近目标岗位的实习。','优先岗位相关性|争取真实项目'),
          item('硕前实习','07–08月','intern r1',78,16,'硕士前最后一次集中补强。','冲刺更高质量实习')
        ])
      ]
    };
  }

  if(isPenultimate){
    return {
      title:`大${cnNum(y)}｜申研前置与核心项目积累`,
      desc:'重点：明确目标方向、完成核心项目、准备第一批高质量实习',
      lanes:[
        lane('keypoint','关键节点','进入申研与求职双线预备期。',[
          item('方向正式确认','09–11月','key r1',4,24,'明确未来主申方向与目标岗位。','明确方向|梳理院校与岗位要求'),
          item('申研前置准备','12–03月','key r2',36,26,'把本学年项目作为申请核心储备。','确定院校|整理推荐信资源'),
          item('高质量实习窗口','07–08月','key important r1',82,12,'完成第一段高质量行业经历。','准备简历|有针对性投递')
        ]),
        lane('growth','专业成长','核心项目、导师反馈和系统课程积累。',[
          item('作品集核心项目','09–12月','portfolio r1',0,27,'完成可进入申研作品集的核心项目。','做深项目|保留完整过程'),
          item('大师课','01–03月','support r2',36,18,'通过外部导师反馈校准项目。','完成项目 review'),
          item('安心办','02–05月','support r1',50,20,'跟进 GPA 与申请材料准备。','GPA 跟进|材料准备'),
          item('夏校 / 强化项目','07–08月','flag r2',79,15,'补充高密度项目。','产出强化项目')
        ]),
        lane('jobprep','求职准备','积累真实商业项目与实习经历。',[
          item('商业实践课','09–12月','practice r1',8,22,'形成第一种可写进简历的行业经验。','提炼项目职责'),
          item('实习 1','07–08月','intern r2',82,12,'完成岗位真实、任务真实的实习。','争取证明或推荐')
        ])
      ]
    };
  }

  return {
    title:`大${cnNum(y)}｜能力深化与行业探索`,
    desc:'重点：进阶项目、专业定位、商业实践与实习积累',
    lanes:[
      lane('keypoint','关键节点','完成专业方向确认并开始长期积累。',[
        item('专业方向确认','09–11月','key r1',6,22,'进一步确认未来申请和职业方向。','分析优势与短板|确定长期项目方向'),
        item('实习准备启动','02–04月','key r2',46,20,'开始准备简历和作品链接。','完成简历初版|整理作品链接'),
        item('暑期实习窗口','07–08月','key r1',82,12,'利用暑假积累真实行业经历。','投递实习|形成项目复盘')
      ]),
      lane('growth','专业成长','进阶课程、作品集项目与导师反馈。',[
        item('进阶专业项目','09–01月','base r1',0,36,'完成更复杂的专业项目。','提高项目完成度|强化技术能力'),
        item('作品集项目积累','01–05月','portfolio r2',34,34,'形成可持续迭代的项目。','保留过程|强化项目叙事'),
        item('安心办 / 大师课','03–06月','support r1',52,24,'校准学习与项目方向。','完成阶段 review')
      ]),
      lane('jobprep','求职准备','开始商业实践与第一段实习。',[
        item('商业实践课','01–04月','practice r1',34,22,'通过真实命题了解行业流程。','形成可写入简历的经历'),

function cnNum(n){return ['零','一','二','三','四','五'][n]||n;}

function buildProgram(){
  const years=[];
  if(ugEnabled){
    for(let i=1;i<=ugYears;i++) years.push({...undergraduateYear(i,ugYears),stage:`ug${i}`,months:monthsUG,terms:termsUG});
  }
  if(masterEnabled){
    for(let i=1;i<=masterYears;i++) years.push({...masterYear(i,masterYears),stage:`m${i}`,months:monthsM,terms:termsM});
  }
  return years;
}

function barHTML(x,type){
  return `<div class="bar ${x.cls}" data-type="${type}" style="left:${x.left}%;width:${x.width}%"
    data-title="${x.title}" data-meta="${x.meta}" data-body="${x.body}" data-todo="${x.todo}">
    <strong>${x.title}</strong><small>${x.meta}</small></div>`;
}

function render(){
  const years=buildProgram();
  const pathParts=[];
  if(ugEnabled) pathParts.push(`${ugYears}年制本科`);
  if(masterEnabled) pathParts.push(`${masterYears}年制硕士`);
  const pathLabel=pathParts.length ? pathParts.join(' + ') : '暂未选择学习阶段';
  const totalYears=(ugEnabled?ugYears:0)+(masterEnabled?masterYears:0);
  document.getElementById('timeline').innerHTML=`
    <div class="programBanner"><strong>${pathLabel}</strong><span>${totalYears ? `共 ${totalYears} 个学年 · 自动匹配申请、实习与校招节奏` : '请在左侧选择本科或硕士阶段'}</span></div>
    ${years.map(y=>`
      <section class="year" data-stage="${y.stage}">
        <div class="yearHead"><h2>${y.title}</h2><p>${y.desc}</p></div>
        <div class="months"><div class="mLabel">月份</div>${y.months.map(m=>`<div class="m">${m}</div>`).join('')}</div>
        <div class="terms">${y.terms}</div>
        ${y.lanes.map(l=>`
          <div class="lane" data-lane="${l.type}">
            <div class="laneLabel"><strong>${l.title}</strong><span>${l.desc}</span></div>
            <div class="cells">${l.items.map(i=>barHTML(i,l.type)).join('')}</div>
          </div>`).join('')}
      </section>`).join('')}
  `;
  bindDrawer();
  applyFilters();
  updateSummary();
}

function updateSummary(){
  const applyKpi=document.getElementById('applyKpi');
  const recruitKpi=document.getElementById('recruitKpi');
  const summary=document.getElementById('summary');

  if(!ugEnabled && !masterEnabled){
    applyKpi.innerText='未选择';
    recruitKpi.innerText='未选择';
    summary.innerHTML='请点击上方按钮选择需要展示的本科阶段或硕士阶段。';
    return;
  }

  applyKpi.innerText=ugEnabled ? `本科最后一年（大${cnNum(ugYears)}）秋季` : '不展示本科';
  recruitKpi.innerText=masterEnabled
    ? (masterYears===1 ? '硕士开学当年秋季' : '硕一试水，硕二主战场')
    : '不展示硕士';

  const parts=[];
  if(ugEnabled){
    parts.push(
      ugYears===3
      ? '三年制本科节奏更紧：应在大二完成申研前置与核心项目，大三秋季直接递交申请。'
      : '四年制本科多出一个完整积累学年：可在大二完成方向深化，大三集中准备申研与高质量实习，大四递交申请。'
    );
  }
  if(masterEnabled){
    parts.push(
      masterYears===1
      ? '一年制硕士开学即秋招，求职作品集必须在入学前成型。'
      : '两年制硕士拥有两次秋招机会：硕一可试水并争取暑期实习，硕二集中冲刺正式 Offer。'
    );
  }
  summary.innerHTML=parts.join('<br><br>');
}
function applyFilters(){
  const active=[...document.querySelectorAll('#filters .chip.active')].map(x=>x.dataset.filter);
  document.querySelectorAll('.lane').forEach(l=>l.classList.toggle('hidden',!active.includes(l.dataset.lane)));
}

function bindDrawer(){
  document.querySelectorAll('.bar').forEach(el=>{
    el.onclick=()=>{
      dTitle.innerText=el.dataset.title;
      dMeta.innerText=el.dataset.meta;
      dBody.innerText=el.dataset.body;
      dTodo.innerHTML=(el.dataset.todo||'').split('|').map(x=>`<li>${x}</li>`).join('');
      drawer.classList.add('show');
    };
  });
}
function closeDrawer(){drawer.classList.remove('show')}

document.querySelectorAll('#ugBtns .seg').forEach(b=>b.onclick=()=>{
  const selectedYears=Number(b.dataset.value);
  const isCurrent=ugEnabled && ugYears===selectedYears;
  if(isCurrent){
    ugEnabled=false;
    document.querySelectorAll('#ugBtns .seg').forEach(x=>x.classList.remove('active'));
  }else{
    ugEnabled=true;
    ugYears=selectedYears;
    document.querySelectorAll('#ugBtns .seg').forEach(x=>x.classList.toggle('active',x===b));
  }
  render();
});
document.querySelectorAll('#masterBtns .seg').forEach(b=>b.onclick=()=>{
  const selectedYears=Number(b.dataset.value);
  const isCurrent=masterEnabled && masterYears===selectedYears;
  if(isCurrent){
    masterEnabled=false;
    document.querySelectorAll('#masterBtns .seg').forEach(x=>x.classList.remove('active'));
  }else{
    masterEnabled=true;
    masterYears=selectedYears;
    document.querySelectorAll('#masterBtns .seg').forEach(x=>x.classList.toggle('active',x===b));
  }
  render();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{c.classList.toggle('active');applyFilters();});

render();
</script>
  <script>
    // 导航栏交互（career-timeline 页面专用）
    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.getElementById('navbar');
      const toggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');
      const links = document.querySelectorAll('.nav-link');

      // 滚动阴影
      window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 50);
      });

      // 移动端菜单
      if (toggle) {
        toggle.addEventListener('click', () => {
          navLinks.classList.toggle('open');
        });
      }

      // 点击链接关闭菜单 & 高亮
      links.forEach(link => {
        link.addEventListener('click', () => {
          links.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          if (navLinks) navLinks.classList.remove('open');
        });
      });
    });
  </script>
