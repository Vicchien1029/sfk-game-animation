<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SFK 游戏动画职业规划：五大就业路径、岗位方向、核心技能与代表企业">
  <title>职业规划 | SFK 游戏动画科系</title>
  <link rel="icon" type="image/jpeg" href="assets/game-animation-department-icon.jpg">
  <link rel="stylesheet" href="styles.css?v=20260908-career-paths">
  <link rel="stylesheet" href="theme.css?v=20260908-career-paths">
  <link rel="stylesheet" href="school-search-v2.css?v=20260909-course-cleanup">
  <link rel="stylesheet" href="support-footer.css?v=20260910-shared-shell-v1">
  <link rel="stylesheet" href="site-nav.css?v=20260910-shared-nav-v2">
</head>
<body class="school-search-page">
  <div data-site-nav data-page="planning"></div>

  <main>
    <section class="career-hero" aria-labelledby="careerHeroTitle">
      <div class="career-shell">
        <p class="career-kicker">CAREER PATHWAYS / INDUSTRY LANDSCAPE</p>
        <h1 id="careerHeroTitle">职业规划 <em>×</em> 产业全景</h1>
        <p class="career-intro">从五条游戏动画产业路径出发，认识创作流程中的岗位分工、核心能力与不同规模的团队形态。</p>
      </div>
    </section>

    <section class="path-navigator" aria-label="五大就业路径"><div class="career-shell path-tabs" id="pathTabs" role="tablist"></div></section>

    <section class="career-shell path-overview" aria-live="polite">
      <div class="path-summary-line"><span id="pathIndex">01</span><strong id="pathName"></strong><small id="pathNameEn"></small></div>
      <p class="path-description" id="pathDescription"></p>
      <div class="path-statements" id="pathStatements" hidden></div>
      <button class="overview-toggle" id="overviewToggle" type="button" aria-expanded="false" aria-controls="pathStatements">展开路径概览 <span aria-hidden="true">↓</span></button>
    </section>

    <section class="career-shell career-workspace">
      <div class="career-dashboard">
        <section class="dashboard-column company-browser" aria-labelledby="companiesHeading">
          <header class="dashboard-heading"><p>COMPANIES</p><h3 id="companiesHeading">就业企业</h3></header>
          <div class="company-category-tabs" id="companyCategoryTabs" role="tablist" aria-label="企业类型"></div>
          <div class="company-list" id="companyList" role="list"></div>
        </section>
        <section class="dashboard-column" aria-labelledby="rolesHeading">
          <header class="dashboard-heading"><p>ROLE DIRECTIONS</p><h3 id="rolesHeading">岗位方向</h3></header>
          <div class="role-groups" id="roleGroups"></div>
        </section>
        <section class="dashboard-column" aria-labelledby="skillsHeading">
          <header class="dashboard-heading"><p>CORE SKILLS</p><h3 id="skillsHeading">核心技能</h3></header>
          <div class="skill-groups" id="skillGroups"></div>
        </section>
      </div>
    </section>
  </main>

  <div data-support-footer></div>

  <div class="career-drawer-layer" id="drawerLayer" hidden>
    <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭详情"></button>
    <aside class="career-drawer" id="careerDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <script src="site-nav.js?v=20260910-shared-nav-v2"></script>
  <script src="support-footer.js?v=20260914-school-order-v2"></script>
  <script src="school-search-data/career-map-data.js"></script>
  <script src="school-search-data/course-search-data.js"></script>
  <script src="school-search-data/career-reference-data.js?v=20260909-all-schools"></script>
  <script src="school-search-v2.js?v=20260909-all-course-links"></script>
</body>
</html>
