<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学位项目 · 斯芬克游戏动画科系</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 学位页面专用样式 */
        .degree-page {
            padding-top: 68px;
            min-height: 100vh;
            background: var(--black);
        }

        /* 顶部标签切换栏 */
        .degree-tabs-bar {
            position: sticky;
            top: 68px;
            z-index: 50;
            background: rgba(10,10,10,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gray-800);
        }
        .degree-tabs-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            gap: 8px;
            height: 64px;
            align-items: center;
        }
        .degree-tab-btn {
            padding: 10px 28px;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-400);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all .3s var(--ease);
            font-family: var(--font);
        }
        .degree-tab-btn:hover {
            color: var(--white);
            background: var(--gray-800);
        }
        .degree-tab-btn.active {
            color: var(--white);
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: var(--shadow-orange);
        }

        /* 内容区域 */
        .degree-content-wrap {
            max-width: 100%;
            margin: 0 auto;
        }
        .degree-panel {
            display: none;
        }
        .degree-panel.active {
            display: block;
        }

        /* iframe 嵌入全日制页面 */
        .degree-iframe {
            width: 100%;
            min-height: calc(100vh - 132px);
            border: none;
            display: block;
        }

        /* 本科内容区域 */
        .ug-content-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* 占位内容样式 */
        .degree-placeholder {
            text-align: center;
            padding: 100px 0;
            color: var(--gray-500);
        }
        .degree-placeholder-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: .3;
        }
        .degree-placeholder h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-300);
            margin-bottom: 12px;
        }
        .degree-placeholder p {
            font-size: 14px;
            color: var(--gray-500);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .degree-tabs-inner { padding: 0 16px; }
            .degree-tab-btn { padding: 8px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-main">斯芬克 · 游戏动画科系</span>
                    <span class="logo-sub">内部资料库</span>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">主页</a></li>
                <li><a href="index.html#cases" class="nav-link">作品案例</a></li>
                <li><a href="school-search.html" class="nav-link">院校查找</a></li>
                <li><a href="index.html#professors" class="nav-link">海外教授</a></li>
                <li><a href="index.html#programs" class="nav-link">短期项目</a></li>
                <li><a href="index.html#data" class="nav-link">录取数据</a></li>
                <li><a href="index.html#quick-entry" class="nav-link">快捷入口</a></li>
                <li class="nav-spacer"></li>
                <li><a href="undergraduate.html" class="nav-link active">全日制</a></li>
                <li><a href="undergraduate.html" class="nav-link">本科</a></li>
                <li><a href="#" class="nav-link" style="opacity:.4;cursor:not-allowed">研究生</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- 学位页面主体 -->
    <div class="degree-page">
        <!-- 标签切换栏 -->
        <div class="degree-tabs-bar">
            <div class="degree-tabs-inner">
                <button class="degree-tab-btn active" data-tab="fulltime">全日制</button>
                <button class="degree-tab-btn" data-tab="undergraduate">本科</button>
                <button class="degree-tab-btn" data-tab="graduate" style="opacity:.4;cursor:not-allowed" disabled>研究生</button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="degree-content-wrap">
            <!-- 全日制内容 - iframe嵌入 -->
            <div class="degree-panel active" id="panel-fulltime">
                <iframe class="degree-iframe" src="fulltime/index-no-header.html" title="全日制1+2国际本科"></iframe>
            </div>

            <!-- 本科内容 -->
            <div class="degree-panel" id="panel-undergraduate">
                <div class="ug-content-wrap">
                    <div class="degree-placeholder">
                        <div class="degree-placeholder-icon">📚</div>
                        <h2>本科申请内容</h2>
                        <p>包含英联邦本科申请、美本申请等方向的详细指南、院校信息、申请流程与资源。</p>
                    </div>
                </div>
            </div>

            <!-- 研究生内容 -->
            <div class="degree-panel" id="panel-graduate">
                <div class="ug-content-wrap">
                    <div class="degree-placeholder">
                        <div class="degree-placeholder-icon">🚧</div>
                        <h2>内容正在搭建中...</h2>
                        <p>研究生申请板块正在建设中，敬请期待。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 标签切换逻辑
        const tabBtns = document.querySelectorAll('.degree-tab-btn');
        const panels = document.querySelectorAll('.degree-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                const target = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                panels.forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + target).classList.add('active');
            });
        });

        // 移动端菜单
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (navToggle && navLinks) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });
        }
    </script>
</body>
</html>
