<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本科申请 · 斯芬克游戏动画科系</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 本科页面专用样式 */
        .ug-page {
            padding-top: 68px;
            min-height: 100vh;
            background: var(--black);
        }
        
        /* 顶部标签切换栏 */
        .ug-tabs-bar {
            position: sticky;
            top: 68px;
            z-index: 50;
            background: rgba(10,10,10,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gray-800);
        }
        .ug-tabs-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            gap: 8px;
            height: 64px;
            align-items: center;
        }
        .ug-tab-btn {
            padding: 10px 28px;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-400);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all .3s var(--ease);
            font-family: var(--font);
        }
        .ug-tab-btn:hover {
            color: var(--white);
            background: var(--gray-800);
        }
        .ug-tab-btn.active {
            color: var(--white);
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: var(--shadow-orange);
        }
        
        /* 内容区域 */
        .ug-content-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .ug-panel {
            display: none;
            animation: fadeSlideIn .5s var(--ease);
        }
        .ug-panel.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        /* 页面标题区 */
        .ug-hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .ug-hero h1 {
            font-size: 36px;
            font-weight: 900;
            color: var(--white);
            margin-bottom: 12px;
        }
        .ug-hero p {
            font-size: 15px;
            color: var(--gray-400);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }
        
        /* 内容卡片网格 */
        .ug-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }
        .ug-card {
            background: var(--gray-900);
            border: 1px solid var(--gray-800);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            transition: all .35s var(--ease);
            cursor: pointer;
        }
        .ug-card:hover {
            transform: translateY(-6px);
            border-color: var(--orange);
            box-shadow: 0 0 24px rgba(255,79,0,.12);
        }
        .ug-card-icon {
            width: 48px;
            height: 48px;
            background: var(--orange-10);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .ug-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 10px;
        }
        .ug-card p {
            font-size: 13px;
            color: var(--gray-400);
            line-height: 1.7;
        }
        
        /* 占位内容样式 */
        .ug-placeholder {
            text-align: center;
            padding: 100px 0;
            color: var(--gray-500);
        }
        .ug-placeholder-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: .3;
        }
        .ug-placeholder h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-300);
            margin-bottom: 12px;
        }
        .ug-placeholder p {
            font-size: 14px;
            color: var(--gray-500);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.7;
        }
        
        @media (max-width: 1024px) {
            .ug-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .ug-grid { grid-template-columns: 1fr; }
            .ug-hero h1 { font-size: 28px; }
            .ug-tabs-inner { padding: 0 16px; }
            .ug-tab-btn { padding: 8px 20px; font-size: 14px; }
        }

        /* 英国教育体系 - 右上方按钮 */
        .uk-edu-top-btn {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .uk-edu-toggle-simple {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--gray-700);
            border-radius: var(--radius-full);
            color: var(--gray-500);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all .25s var(--ease);
        }
        .uk-edu-toggle-simple:hover {
            color: var(--orange);
            border-color: var(--orange);
        }
        .uk-edu-toggle-arrow {
            font-size: 10px;
            transition: transform .3s var(--ease);
        }
        .uk-edu-toggle-simple.active .uk-edu-toggle-arrow {
            transform: rotate(180deg);
        }

        /* 英国教育体系 - 展开面板 */
        .uk-edu-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height .5s var(--ease), opacity .4s var(--ease);
            opacity: 0;
        }
        .uk-edu-panel.open {
            max-height: 500px;
            opacity: 1;
        }

        /* 英国教育体系 - 互动图谱（暗色主题适配） */
        .uk-edu-map {
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
            padding: 0;
            width: 100%;
        }
        .uk-edu-mobile-note {
            display: none;
            color: var(--gray-500);
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .uk-edu-level-strip {
            display: flex;
            gap: 8px;
            height: 500px;
            min-height: 0;
        }
        .uk-edu-level-panel {
            flex: 1 1 0;
            min-width: 72px;
            border: 1px solid var(--gray-800);
            border-radius: var(--radius-xl);
            background: var(--dark);
            overflow: hidden;
            cursor: pointer;
            transition: flex .38s ease, box-shadow .25s ease, transform .25s ease;
            position: relative;
        }
        .uk-edu-level-panel:hover,
        .uk-edu-level-panel.active {
            flex: 5.4 1 0;
            box-shadow: 0 20px 46px rgba(0,0,0,.30);
            transform: translateY(-2px);
        }
        .uk-edu-level-panel:not(:hover):not(.active) {
            flex: .72 1 0;
        }
        .uk-edu-level-tab {
            height: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
            color: #fff;
            font-weight: 900;
            letter-spacing: .02em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 20px;
            transition: opacity .2s ease;
        }
        .uk-edu-level-panel:hover .uk-edu-level-tab,
        .uk-edu-level-panel.active .uk-edu-level-tab {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
        .uk-edu-level-content {
            display: none;
            height: 100%;
            min-height: 0;
            padding: 16px;
            overflow: hidden;
            background: var(--gray-900);
        }
        .uk-edu-level-panel:hover .uk-edu-level-content,
        .uk-edu-level-panel.active .uk-edu-level-content {
            display: flex;
            flex-direction: column;
        }
        .uk-edu-level-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-800);
        }
        .uk-edu-level-badge {
            flex: 0 0 auto;
            min-width: 76px;
            border-radius: 18px;
            color: #fff;
            text-align: center;
            font-weight: 900;
            padding: 10px 8px;
        }
        .uk-edu-level-badge small {
            display: block;
            font-size: 11px;
            opacity: .88;
        }
        .uk-edu-level-badge span {
            display: block;
            font-size: 22px;
            line-height: 1.05;
        }
        .uk-edu-level-title h3 {
            margin: 0;
            font-size: 18px;
            line-height: 1.25;
            color: var(--white);
        }
        .uk-edu-level-title .en {
            display: block;
            color: var(--gray-500);
            font-weight: 400;
            font-size: .88em;
            margin-top: 4px;
        }
        .uk-edu-level-title p {
            margin: 6px 0 0;
            color: var(--gray-500);
            font-size: 13px;
            line-height: 1.5;
        }
        .uk-edu-content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
            margin-top: 10px;
        }
        .uk-edu-card {
            border: 1px solid var(--gray-800);
            background: var(--dark);
            border-radius: 18px;
            padding: 11px;
        }
        .uk-edu-card h4 {
            margin: 0 0 7px;
            font-size: 14px;
            color: var(--white);
        }
        .uk-edu-items {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }
        .uk-edu-item {
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 14px;
            padding: 8px;
        }
        .uk-edu-item strong {
            display: block;
            font-size: 13px;
            line-height: 1.35;
            color: var(--white);
        }
        .uk-edu-item span {
            display: block;
            color: var(--gray-500);
            font-size: 12px;
            line-height: 1.5;
            margin-top: 3px;
        }
        .uk-edu-route {
            background: var(--gray-800);
        }
        .uk-edu-route p {
            margin: 0;
            color: var(--gray-500);
            font-size: 13px;
            line-height: 1.7;
        }
        .uk-edu-path-footer {
            margin-top: auto;
            padding-top: 6px;
        }
        .uk-edu-path-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }
        .uk-edu-chip {
            border-radius: 999px;
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            padding: 6px 8px;
            font-size: 11px;
            color: var(--gray-400);
        }
        .uk-edu-cat-higher .uk-edu-level-tab,
        .uk-edu-cat-higher .uk-edu-level-badge { background: #25a7d8; }
        .uk-edu-cat-he .uk-edu-level-tab,
        .uk-edu-cat-he .uk-edu-level-badge { background: #8a9a30; color: #fff; }
        .uk-edu-cat-fe .uk-edu-level-tab,
        .uk-edu-cat-fe .uk-edu-level-badge { background: #e5007f; }
        .uk-edu-cat-school .uk-edu-level-tab,
        .uk-edu-cat-school .uk-edu-level-badge { background: #5d337f; }
        .uk-edu-cat-entry .uk-edu-level-tab,
        .uk-edu-cat-entry .uk-edu-level-badge { background: #8a6f9e; }

        @media (max-width: 980px) {
            .uk-edu-mobile-note { display: block; }
            .uk-edu-level-strip {
                flex-direction: column;
                height: auto;
                min-height: auto;
            }
            .uk-edu-level-panel,
            .uk-edu-level-panel:not(:hover):not(.active),
            .uk-edu-level-panel:hover,
            .uk-edu-level-panel.active {
                flex: auto;
                min-width: 0;
                transform: none;
            }
            .uk-edu-level-tab {
                min-height: 60px;
                height: 60px;
                writing-mode: horizontal-tb;
                font-size: 18px;
            }
            .uk-edu-level-content,
            .uk-edu-level-panel:hover .uk-edu-level-content,
            .uk-edu-level-panel.active .uk-edu-level-content {
                min-height: auto;
                height: auto;
                display: none;
            }
            .uk-edu-level-panel.active .uk-edu-level-content {
                display: flex;
            }
            .uk-edu-level-panel.active .uk-edu-level-tab {
                display: none;
            }
            .uk-edu-items { grid-template-columns: 1fr; }
        }

        /* ========== 学生作品展示板块 ========== */
        .portfolio-showcase {
            display: flex;
            gap: 20px;
            margin-top: 48px;
            min-height: 600px;
        }
        .portfolio-main {
            flex: 1 1 0;
            min-width: 0;
        }
        .portfolio-carousel {
            position: relative;
            width: 100%;
            height: 640px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: var(--gray-900);
            border: 1px solid var(--gray-800);
        }
        .carousel-images {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .carousel-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity .8s var(--ease);
        }
        .carousel-img.active {
            opacity: 1;
        }

        /* 悬停信息遮罩 */
        .portfolio-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 48px 32px 32px;
            background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 60%, transparent 100%);
            opacity: 0;
            transform: translateY(12px);
            transition: all .4s var(--ease);
            pointer-events: none;
        }
        .portfolio-carousel:hover .portfolio-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        .overlay-content {
            max-width: 720px;
        }
        .student-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            margin: 0 0 10px;
            letter-spacing: .02em;
        }
        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .course-type {
            font-size: 14px;
            color: var(--gray-300);
            background: rgba(255,255,255,.10);
            padding: 5px 14px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,.12);
        }
        .grade {
            font-size: 15px;
            font-weight: 800;
            color: var(--orange);
            background: rgba(255,79,0,.15);
            padding: 5px 14px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255,79,0,.25);
        }
        .work-desc {
            font-size: 14px;
            color: var(--gray-300);
            line-height: 1.7;
            margin: 0;
            max-width: 600px;
        }

        /* 左右切换按钮 */
        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.25);
            border: none;
            color: rgba(255,255,255,.55);
            cursor: pointer;
            opacity: 0;
            transition: all .35s var(--ease);
            z-index: 6;
            padding: 0;
        }
        .carousel-nav-btn svg {
            width: 20px;
            height: 20px;
        }
        .carousel-prev {
            left: 0;
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
            padding-left: 6px;
        }
        .carousel-next {
            right: 0;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            padding-right: 6px;
        }
        .portfolio-carousel:hover .carousel-nav-btn {
            opacity: 1;
        }
        .carousel-nav-btn:hover {
            background: rgba(0,0,0,.55);
            color: var(--white);
        }

        /* 轮播指示器 */
        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,.35);
            cursor: pointer;
            transition: all .3s var(--ease);
        }
        .carousel-dot.active {
            background: var(--orange);
            width: 24px;
            border-radius: 4px;
        }

        /* 右侧案例列表 */
        .portfolio-sidebar {
            flex: 0 0 196px;
            display: flex;
            flex-direction: column;
        }
        .case-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 640px;
            padding-right: 4px;
        }
        .case-list::-webkit-scrollbar { width: 4px; }
        .case-list::-webkit-scrollbar-track { background: transparent; }
        .case-list::-webkit-scrollbar-thumb { background: var(--gray-700); border-radius: 4px; }

        .case-thumb {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: var(--radius-lg);
            background: var(--gray-900);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all .3s var(--ease);
        }
        .case-thumb:hover {
            background: var(--gray-800);
            border-color: var(--gray-700);
        }
        .case-thumb.active {
            border-color: var(--orange);
            background: rgba(255,79,0,.08);
        }
        .case-thumb-img {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            object-fit: cover;
            flex-shrink: 0;
            background: var(--gray-800);
        }
        .case-thumb-info {
            min-width: 0;
        }
        .case-thumb-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--white);
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .case-thumb-meta {
            font-size: 12px;
            color: var(--gray-500);
            margin: 0;
        }

        @media (max-width: 1024px) {
            .portfolio-showcase {
                flex-direction: column;
            }
            .portfolio-sidebar {
                flex: auto;
                width: 100%;
            }
            .case-list {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                max-height: none;
                padding-right: 0;
                padding-bottom: 4px;
            }
            .case-list::-webkit-scrollbar { height: 4px; }
            .case-thumb {
                flex-direction: column;
                min-width: 100px;
                text-align: center;
                padding: 12px 8px;
            }
            .case-thumb-img {
                width: 72px;
                height: 72px;
            }
            .portfolio-carousel {
                height: 480px;
            }
        }
        @media (max-width: 768px) {
            .portfolio-carousel {
                height: 360px;
            }
            .portfolio-overlay {
                padding: 32px 20px 24px;
            }
            .student-name { font-size: 20px; }
            .work-desc { font-size: 13px; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-main">斯芬克 · 游戏动画科系</span>
                    <span class="logo-sub">内部资料库</span>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">主页</a></li>
                <li><a href="index.html#cases" class="nav-link">作品案例</a></li>
                <li><a href="index.html#professors" class="nav-link">海外教授</a></li>
                <li><a href="index.html#programs" class="nav-link">短期项目</a></li>
                <li><a href="index.html#data" class="nav-link">录取数据</a></li>
                <li><a href="index.html#quick-entry" class="nav-link">快捷入口</a></li>

                <li><a href="undergraduate.html" class="nav-link active">本科</a></li>
                <li><a href="#" class="nav-link" style="opacity:.4;cursor:not-allowed">研究生</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- 本科页面主体 -->
    <div class="ug-page">
        <!-- 标签切换栏 -->
        <div class="ug-tabs-bar">
            <div class="ug-tabs-inner">
                <button class="ug-tab-btn active" data-tab="commonwealth">英联邦</button>
                <button class="ug-tab-btn" data-tab="us-others">美本及其他</button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="ug-content-wrap">
            <!-- 英联邦内容 -->
            <div class="ug-panel active" id="panel-commonwealth">
                <!-- 右上方收起/展开按钮 -->
                <div class="uk-edu-top-btn">
                    <button class="uk-edu-toggle-simple" id="ukEduToggle" onclick="toggleUkEdu()">
                        <span>英国教育体系</span>
                        <span class="uk-edu-toggle-arrow" id="ukEduArrow">▾</span>
                    </button>
                </div>

                <!-- 英国教育体系互动工具（默认展开） -->
                <div class="uk-edu-panel open" id="ukEduPanel">
                    <div class="uk-edu-map">
                        <div class="uk-edu-mobile-note">移动端建议点击 Level 展开查看；桌面端鼠标悬停即可展开。</div>
                        <div class="uk-edu-level-strip" id="ukEduStrip"></div>
                    </div>
                </div>

                <!-- 学生作品展示板块 -->
                <div class="portfolio-showcase" id="portfolioShowcase">
                    <div class="portfolio-main">
                        <!-- 大图轮播区 -->
                        <div class="portfolio-carousel">
                            <div class="carousel-images" id="carouselImages">
                                <!-- 动态生成图片 -->
                            </div>

        function renderUkEdu(){
          const strip=document.getElementById('ukEduStrip');
          strip.innerHTML=ukLevels.map((l,i)=>`
            <article class="uk-edu-level-panel uk-edu-cat-${l.cat} ${i===2?'active':''}" tabindex="0">
              <div class="uk-edu-level-tab">Level ${l.level}</div>
              <div class="uk-edu-level-content">
                <div class="uk-edu-level-header">
                  <div class="uk-edu-level-badge"><small>LEVEL</small><span>${l.level}</span></div>

                    <h3>${l.titleCN}<span class="en">${l.titleEN}</span></h3>
                    <p>${l.summaryCN}<br>${l.summaryEN}</p>
                  </div>
                </div>
                <div class="uk-edu-content-grid">
                  <div class="uk-edu-card">
                    <h4>常见资格 / Common qualifications</h4>
                    <div class="uk-edu-items">
                      ${l.items.map(it=>`<div class="uk-edu-item"><strong>${it[0]}</strong><span>${it[1]}</span></div>`).join('')}
                    </div>
                  </div>
                  <div class="uk-edu-card uk-edu-route">
                    <h4>典型去向 / Typical progression</h4>
                    <p>${l.routeCN}<br>${l.routeEN}</p>

                </div>
                <div class="uk-edu-path-footer">
                  <div class="uk-edu-path-chips">
                    <span class="uk-edu-chip">GCSE</span>
                    <span class="uk-edu-chip">A Level</span>
                    <span class="uk-edu-chip">BTEC</span>
                    <span class="uk-edu-chip">HNC / HND</span>

                    <span class="uk-edu-chip">Master</span>

                </div>
              </div>
            </article>
          `).join('');
          document.querySelectorAll('.uk-edu-level-panel').forEach(panel=>{
            panel.addEventListener('mouseenter',()=>setUkActive(panel));
            panel.addEventListener('focus',()=>setUkActive(panel));
            panel.addEventListener('click',()=>setUkActive(panel));
          });
        }
        function setUkActive(panel){
          document.querySelectorAll('.uk-edu-level-panel').forEach(p=>p.classList.remove('active'));
          panel.classList.add('active');
        }
        renderUkEdu();

        // ========== 学生作品展示板块 ==========
        const portfolioData = [
            {
                name: '张思远',
                course: 'A-Level 平面设计',
                grade: 'A*',
                desc: '以"城市记忆"为主题，通过混合媒介探索城市化进程中个体与空间的情感联结。作品融合了摄影拼贴、丝网印刷与数字插画，展现了独特的视觉叙事能力。',
                images: ['case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg']
            },
            {
                name: '李雨桐',
                course: 'A-Level 纯艺术',
                grade: 'A*',
                desc: '专注于自然形态与人体结构的抽象表现，运用油画、丙烯及综合材料创作了一系列大型画布作品。色彩层次丰富，笔触充满表现力。',
                images: ['case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg']
            },
            {
                name: '王子墨',
                course: 'BTEC 艺术与设计',
                grade: 'Distinction',
                desc: '探索数字艺术与交互设计的边界，创作了一组融合AR技术的沉浸式装置作品。项目展现了出色的技术整合能力与前瞻性的设计思维。',
                images: ['case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg']
            },
            {
                name: '陈嘉怡',
                course: 'A-Level 纺织品设计',
                grade: 'A*',
                desc: '从传统扎染工艺中汲取灵感，结合现代数码印花技术，创作了一系列具有东方美学韵味的面料设计。图案语言独特，色彩搭配精妙。',
                images: ['case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg']
            },
            {
                name: '刘浩然',
                course: 'A-Level 摄影',
                grade: 'A*',
                desc: '以纪实摄影的方式记录了城市边缘社区的日常生活，通过黑白影像呈现强烈的人文关怀。构图严谨，光影运用极具电影感。',
                images: ['case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg']
            },
            {
                name: '赵晓雯',
                course: 'IB 视觉艺术',
                grade: '7',
                desc: '围绕"身份认同"主题展开跨媒介创作，涵盖雕塑、影像与装置艺术。作品概念深刻，呈现出成熟的艺术思考与批判性思维。',
                images: ['case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg']
            },
            {
                name: '周凯文',
                course: 'A-Level 三维设计',
                grade: 'A*',
                desc: '运用参数化设计与3D打印技术，创作了一系列探索几何形态与空间关系的雕塑作品。结构精密，兼具美学价值与工程巧思。',
                images: ['case8.jpg','case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg']
            },
            {
                name: '吴欣怡',
                course: 'A-Level 平面设计',
                grade: 'A',
                desc: '专注于品牌视觉识别系统设计，为虚构的文化机构打造了完整的视觉体系。版式优雅，字体选择考究，展现了出色的商业设计素养。',
                images: ['case9.jpg','case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg']
            },
            {
                name: '郑宇航',
                course: 'BTEC 游戏设计',
                grade: 'Distinction*',
                desc: '独立开发了一款基于中国传统神话的2D平台解谜游戏，从角色设计到关卡策划均独立完成。美术风格独特，玩法机制创新。',
                images: ['case10.jpg','case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg']
            },
            {
                name: '林诗涵',
                course: 'A-Level 纯艺术',
                grade: 'A*',
                desc: '以水彩与水墨为主要媒介，创作了一系列描绘梦境与潜意识意象的作品。画面空灵飘逸，技法娴熟，展现了东方美学与当代艺术的融合。',
                images: ['case1.jpg','case2.jpg','case3.jpg','case4.jpg','case5.jpg','case6.jpg','case8.jpg','case9.jpg','case10.jpg','case1.jpg']
            }
        ];

        let currentCaseIndex = 0;
        let currentImageIndex = 0;
        let autoPlayTimer = null;
        const IMAGE_INTERVAL = 4000; // 每张图片展示4秒
        const IMG_BASE = 'assets/portfolio/';

        const carouselImages = document.getElementById('carouselImages');
        const carouselIndicators = document.getElementById('carouselIndicators');
        const caseList = document.getElementById('caseList');
        const studentName = document.getElementById('studentName');
        const courseType = document.getElementById('courseType');
        const grade = document.getElementById('grade');
        const workDesc = document.getElementById('workDesc');

        // 初始化渲染
        function initPortfolio() {
            // 渲染轮播图片（只渲染当前案例的10张图）
            renderCarouselImages();
            // 渲染指示器
            renderIndicators();
            // 渲染右侧缩略图列表
            renderCaseList();
            // 显示当前案例信息
            updateCaseInfo();
            // 显示第一张图
            showImage(0);
            // 启动自动播放
            startAutoPlay();
        }

        function renderCarouselImages() {
            const caseData = portfolioData[currentCaseIndex];
            carouselImages.innerHTML = caseData.images.map((img, i) =>
                `<img src="${IMG_BASE}${img}" class="carousel-img ${i===0?'active':''}" alt="作品图片" loading="lazy">`
            ).join('');
        }

        function renderIndicators() {
            const caseData = portfolioData[currentCaseIndex];
            carouselIndicators.innerHTML = caseData.images.map((_, i) =>
                `<div class="carousel-dot ${i===0?'active':''}" data-index="${i}"></div>`
            ).join('');
        }

        function renderCaseList() {
            caseList.innerHTML = portfolioData.map((c, i) => `
                <div class="case-thumb ${i===currentCaseIndex?'active':''}" data-index="${i}">
                    <img src="${IMG_BASE}${c.images[0]}" class="case-thumb-img" alt="${c.name}">
                    <div class="case-thumb-info">
                        <p class="case-thumb-name">${c.name}</p>
                        <p class="case-thumb-meta">${c.course}</p>
                    </div>
                </div>
            `).join('');

            // 绑定点击事件
            caseList.querySelectorAll('.case-thumb').forEach(thumb => {
                thumb.addEventListener('click', () => {
                    const idx = parseInt(thumb.dataset.index);
                    if (idx !== currentCaseIndex) {
                        switchCase(idx);
                    }
                });
            });
        }

        function updateCaseInfo() {
            const data = portfolioData[currentCaseIndex];
            studentName.textContent = data.name;
            courseType.textContent = data.course;
            grade.textContent = data.grade;
            workDesc.textContent = data.desc;
        }

        function showImage(index) {
            const imgs = carouselImages.querySelectorAll('.carousel-img');
            const dots = carouselIndicators.querySelectorAll('.carousel-dot');
            imgs.forEach((img, i) => img.classList.toggle('active', i === index));
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
            currentImageIndex = index;
        }

        function nextImage() {
            const caseData = portfolioData[currentCaseIndex];
            const next = (currentImageIndex + 1) % caseData.images.length;
            showImage(next);
        }

        function switchCase(index) {
            currentCaseIndex = index;
            currentImageIndex = 0;
            renderCarouselImages();
            renderIndicators();
            updateCaseInfo();
            showImage(0);
            updateActiveThumb();
            resetAutoPlay();
        }

        function updateActiveThumb() {
            caseList.querySelectorAll('.case-thumb').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentCaseIndex);
            });
        }

        function startAutoPlay() {
            stopAutoPlay();
            autoPlayTimer = setInterval(() => {
                const caseData = portfolioData[currentCaseIndex];
                if (currentImageIndex < caseData.images.length - 1) {
                    showImage(currentImageIndex + 1);
                } else {
                    // 当前案例图片放完，切换到下一个案例
                    const nextCase = (currentCaseIndex + 1) % portfolioData.length;
                    switchCase(nextCase);
                }
            }, IMAGE_INTERVAL);
        }

        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
            }
        }

        function resetAutoPlay() {
            startAutoPlay();
        }

        // 鼠标悬停暂停自动播放
        const carouselEl = document.querySelector('.portfolio-carousel');
        carouselEl.addEventListener('mouseenter', stopAutoPlay);
        carouselEl.addEventListener('mouseleave', startAutoPlay);

        // 指示器点击
        carouselIndicators.addEventListener('click', (e) => {
            if (e.target.classList.contains('carousel-dot')) {
                const idx = parseInt(e.target.dataset.index);
                showImage(idx);
                resetAutoPlay();
            }
        });

        // 左右切换按钮点击
        document.getElementById('carouselPrev').addEventListener('click', () => {
            const caseData = portfolioData[currentCaseIndex];
            const prev = currentImageIndex > 0 ? currentImageIndex - 1 : caseData.images.length - 1;
            showImage(prev);
            resetAutoPlay();
        });
        document.getElementById('carouselNext').addEventListener('click', () => {
            const caseData = portfolioData[currentCaseIndex];
            if (currentImageIndex < caseData.images.length - 1) {
                showImage(currentImageIndex + 1);
            } else {
                const nextCase = (currentCaseIndex + 1) % portfolioData.length;
                switchCase(nextCase);
            }
            resetAutoPlay();
        });

        initPortfolio();
    </script>
